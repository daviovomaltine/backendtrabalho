<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="idex.css">
</head>
<body>
<div id="card">
    <h1>CheckOut de Compra</h1>
    <div>
        <label for="">Preço do Produto(R$)</label>
        <input type="text" placeholder="EX: 100,00">
        <label for="">Valor do Frete(R$)</label>
        <input type="text" placeholder="EX: 15,00">
    </div>
    <div id="botao">
        <h3>Forma de Pagamento:</h3>
       <input type="submit" value="PIX (-10%)" id="botao1">
       <input type="submit" value="DINHEIRO (-5%)" id="botao2">
       <input type="submit" value="CARTAO À VISTA" id="botao3">
       <input type="submit" value="PARCELADO (+10%)" id="botao4">
    </div>
    <div>
        <p>Forma:</p>
        <p>Total: R$ 0,00k</p>
    </div>
</div>
</body>
